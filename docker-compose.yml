services:
  auth_db:
    image: postgres:17
    container_name: auth_postgres-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5433:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d auth_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-users
    ports:
      - "8082:8080"
    depends_on:
      auth_db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://auth_db:5432/auth_db
      DATABASE_USERNAME: user
      DATABASE_PASSWORD: pass
      APP_JWT_SECRET: x9V4bN7mQ2pL5wR8zK3jH6cF1gT9vD4sY8nB2mX5cZ7vM3kP9lJ4hG1rT6dW8yN2
volumes:
  auth_db_data: